const DATA = [{"no": "001", "vol": 1, "title": "判断是内部承包还是挂靠，法院看三件事", "question": "一份写着「内部承包」的协议，怎么判断是内部分工还是借用资质？", "rule": "不看协议叫什么名字，只看三条线是否同时成立：企业对该人有真实的管理关系；双方有劳动关系（劳动合同、工资、社保）；对外一律以企业名义签约收款。三条都成立才是内部承包，缺一条就可能被认定为挂靠。", "case_main": {"name": "吴国民诉宝钢工程建设有限公司企业承包经营合同纠纷案", "court": "上海市第二中级人民法院", "no": "（2018）沪02民终3487号"}, "case_ref": "福建龙弘建筑工程有限公司诉福建省龙海第一中学案（结论相反：协议名为承包，实为借用资质）", "flip": "签了劳动合同、挂着职工名分，但企业不管人、不管账、不管现场，只按工程款比例收管理费，三条线一条都站不住，结论翻转为挂靠，协议无效。", "action": "按项目归一份档案：劳动合同与社保记录、工资发放凭证、对外签署的授权文件（付款审批单、内部转账支票上签的是谁的身份）。接活前先问一句：社保在谁名下缴。", "tags": {"identity": ["内部承包", "挂靠"], "target": ["总公司"], "hinge": ["劳动关系", "对外名义"], "newrule": "未涉及"}, "source_mix": "判决理由 3 条 + 编写人评析 1 条（正文已分层标注）"}, {"no": "002", "vol": 1, "title": "干完活拿不到钱，能找总包要吗", "question": "在工地上被欠钱，能往上找几层要？", "rule": "实际施工人突破合同相对性的通道只开给「实际施工人」，且只通向「发包人」。总包不是发包人，班组工人不是实际施工人。两层身份错一层，案子在主体资格阶段就结束。", "case_main": {"name": "王某甲诉陕西有色建设有限公司、陕西奋发建筑劳务有限公司、王某乙劳务合同纠纷案", "court": "西安市中级人民法院（二审）", "no": "（2019）陕01民终10600号；一审（2019）陕0112民初6268号"}, "case_ref": "佛山木工班组案（同一工种，自负盈亏的班组负责人被认定为实际施工人，结论相反）", "flip": "身份可翻转：自己组织施工、自己发工资、自己担盈亏的班组负责人，身份从「工人」挪到「实际施工人」。对象可翻转：发包人订约时知道或应当知道借用资质的，可直接主张折价补偿，但全部重量压在「知情」的举证上。请求性质不可混：工资通道不含利润与管理费。", "action": "每个项目部把木工、钢筋工班组的用工模式写成一份书面文件，只写三件事：人是谁招的、工资是谁发的、盈亏是谁担的。", "tags": {"identity": ["实际施工人", "违法分包"], "target": ["发包人", "总包"], "hinge": ["合同相对性"], "newrule": "解释二第4条"}, "source_mix": "判决理由 2 条 + 编写人评析 1 条"}, {"no": "003", "vol": 1, "title": "私刻的公章，公司照样要赔", "question": "章是别人私刻的，公司为什么还要担责？", "rule": "判断重心不在章的真假，在两件事：相对人能否被认定为善意无过失，公司自己有没有制造可归责的外观。把分公司交给个人经营、按约定收管理费，却拿不出任何阻止其以公司名义对外签约的制度，章是私刻的也要赔。", "case_main": {"name": "陈强诉江苏华宝建设工程有限公司德清分公司、江苏华宝建设工程有限公司、陶学明租赁合同纠纷案", "court": "绍兴市中级人民法院（二审）", "no": "（2015）浙绍商终字第356号；一审（2014）绍越商初字第3814号"}, "case_ref": "重庆市江泰劳务有限公司第一分公司诉河北建工集团重庆分公司案（非备案印章仍构成表见代理，但合同生效条件未满足，最终不担责）", "flip": "三处：相对人的注意义务（印面有禁字、用印要审批、相对人明知、现金交个人，四件凑齐可免责）；合同本身是否生效并实际履行（表见代理成立也可能因未生效而不担责）；分公司有无独立财产（无财产则责任回到总公司）。", "action": "本月内做一张《在用印章清册》：印章名称、保管人、用印审批人三列；所有印章由本部指定人员保管，不得由项目经理、内部承包人或挂靠人保管；项目部章加刻「对外签订合同、出具收据一律无效」。", "tags": {"identity": ["分公司", "项目部", "挂靠"], "target": ["分公司", "总公司"], "hinge": ["授权与印章"], "newrule": "未涉及"}, "source_mix": "判决理由 2 条 + 编写人评析 1 条"}, {"no": "004", "vol": 1, "title": "总包说是内部承包，法院翻开了工资流水", "question": "「只收三个点管理费」为什么被认定为转包？", "rule": "内部承包的三个要件：承包方是企业内部人员（有真实劳动或隶属管理关系）；企业对项目给予资金、技术、设备、人力的支持和管理；对外由企业承担责任。缺一件就不成立。企业没退出合同、还在投入和担责，才是内部承包；只收管理费、风险全转移，就是转包。", "case_main": {"name": "鼎展（福建）投资有限公司与蒋兆洋、马德、王松松建设工程施工合同纠纷案", "court": "福建省清流县人民法院", "no": "（2021）闽0423民初825号"}, "case_ref": "九鼎案（同样写「内部承包」，因合同签在施工合同之前、工程款汇入公司指定账户，被认定为挂靠）", "flip": "三处：第一层要件看真实劳动或隶属管理关系（工资、考勤、社保、工作安排），不是看有没有一纸劳动合同；转包与挂靠的分野还看时间顺序与资金账户；无效合同里，竣工验收合格是请求折价补偿的前置条件。", "action": "把公司所有以内部承包、项目责任制、班组承包、项目投资合作命名的合同，按项目拉一张四栏表：合同签订时间顺序、工程款进谁账户、工资社保谁实际支付、公司留下哪些管理痕迹（技术交底、材料验收、安全检查、用印审批）。", "tags": {"identity": ["内部承包", "转包", "挂靠"], "target": ["总公司", "前手"], "hinge": ["劳动关系", "资金流向", "验收合格"], "newrule": "未涉及"}, "source_mix": "判决理由 4 步 + 编写人评析 1 条"}, {"no": "005", "vol": 1, "title": "层层转包，法院只认跟你签合同的那一家", "question": "工程转了好几手，钱能往上追几层？", "rule": "原则上只能向自己的合同相对方主张。要让上一层承担连带责任，必须有法律规定或当事人明确约定。旧解释第二十六条给实际施工人的直诉通道，今天应理解为代位权的典型场景，而不是连带责任的依据。", "case_main": {"name": "何某甲诉中水建管国际工程有限公司等建设工程施工合同纠纷案", "court": "江西省九江市中级人民法院（二审）", "no": "（2021）赣04民终278号；一审（2020）赣0481民初2257号"}, "case_ref": "同一争点的另一判决（把责任性质说透：无合同关系即无连带，除非有约定）", "flip": "三处：连带要么法定要么约定，写在签合同那天，不是起诉那天；前手失联或资不抵债时换走代位权（前手怠于行使到期债权）；主张工资与主张工程款是两条通道，工资不含利润与管理费。", "action": "给每个在建项目画一张合同链条表，一层一行三栏：签约主体、收款主体、结算与开票主体；旁边单列发包人当前实欠承包人多少。新签分包合同，收款账户必须是签约主体自己名下账户。", "tags": {"identity": ["转包", "违法分包", "实际施工人"], "target": ["前手", "发包人"], "hinge": ["合同相对性", "资金流向"], "newrule": "解释二第7条"}, "source_mix": "判决理由 3 条 + 编写人评析 1 条"}, {"no": "006", "vol": 1, "title": "挂靠接的活，工程款能直接找发包人要吗", "question": "挂靠人和发包人之间没有合同，能不能直接起诉发包人？", "rule": "关键事实只有一个：发包人订立合同时知不知道挂靠。知情的，挂靠人可直接向发包人主张折价补偿；不知情的，只能走合同相对方，或在前手怠于行使债权时走代位权。", "case_main": {"name": "李某某诉北京四海消防工程有限公司建设工程施工合同纠纷案", "court": "北京市第二中级人民法院（二审）", "no": "（2021）京02民终798号；一审（2020）京0115民初11227号"}, "case_ref": "同一事实在解释二施行前后的两种答案（旧案支持直诉，新案被第四条第一款驳回）", "flip": "三处：发包人知情（第四条第二款，出借资质企业的诉讼地位由法院一并处理）；请求权换成代位权（债权到期＋前手怠于行使）；主张的是工资而非工程款（解释二第八条，不含利润与管理费）。规则只适用于施行后新受理的一审案件，旧案仍按旧规。", "action": "给每个挂靠或疑似挂靠项目做一份知情证据夹，固定五样：洽谈记录、人员关系（谁派驻、谁发工资、社保在哪缴）、款项流向、往来文件（联系函、罚款单、整改通知的收件人）、票据（谁开票、谁签收）。凑不齐就按不知情准备。", "tags": {"identity": ["挂靠", "实际施工人"], "target": ["发包人", "前手"], "hinge": ["发包人知情", "合同相对性"], "newrule": "解释二第4条"}, "source_mix": "判决理由 2 条 + 编写人评析 2 条（含新旧规则对比）"}, {"no": "007", "vol": 1, "title": "项目部那块牌子，当不了被告", "question": "盖着项目部章的结算单，该告项目部还是告公司？", "rule": "项目部是承包人为特定工程在现场设立的内部机构，不是法人、也不是其他组织，不能自己当被告；它签下的账就是公司的账。分公司依法登记、领有营业执照，可以当被告，但责任先以其管理的财产承担，不足部分由公司补上。判据不是牌子上的字，是登记信息。", "case_main": {"name": "黄榕凯、郑锋诉中国二十冶集团有限公司买卖合同纠纷案", "court": "福州市中级人民法院（二审）", "no": "（2021）闽01民终8293号；一审（2021）闽0102民初5767号"}, "case_ref": "恩施州中院（2021）28民终3205号案（案卷原文如此，代字不全；被告栏写着「项目部」却判其赔偿，因该「项目部」实际已登记为有限责任公司分公司）", "flip": "三处：项目部章盖在采购合同上且无授权痕迹，对公司不发生效力；分公司在诉讼中注销，责任改由公司承担；名字叫项目部但已登记为分公司的，可以当被告，看登记，不看牌子。", "action": "第一次送货前查清对面是谁并留档五样：现场标牌照片（含拍摄时间）、国家企业信用信息公示系统的登记信息、合同与送货单抬头全称、结算单上的签字与职务、款项出自哪个账户。", "tags": {"identity": ["项目部", "分公司"], "target": ["分公司", "总公司"], "hinge": ["登记性质", "授权与印章"], "newrule": "未涉及"}, "source_mix": "判决理由 2 条 + 编写人评析 1 条 + 反例 1 件"}, {"no": "008", "vol": 1, "title": "他告了三家，法院只让一家还钱", "question": "活是我干的、欠条不是我名下的，该把谁写进被告栏？", "rule": "身份与相对人是两件事，必须分开做：先按证据确定自己属于借用资质、接受转包、接受违法分包还是纯劳务，再按这个身份找法律允许的被告。告三家不等于三家都赔。", "case_main": {"name": "郭某诉汪某某、河南天河建设工程有限公司宁夏分公司、河南天河建设工程有限公司建设工程施工合同纠纷案", "court": "银川市中级人民法院（二审）", "no": "（2020）宁01民终3798号；一审（2020）宁0121民初342号"}, "case_ref": "发包人明知挂靠的事实合同关系（旧规出口，新解释第四条收进条文）", "flip": "三处：发包人明知则挂靠人可直接主张；签字人若能用劳动合同、社保或授权证明自己是分公司员工，责任落点改变；2026 年 6 月 30 日后立案的新案，不能再沿旧解释第二十六条直诉发包人，只能按解释二第六、七、八条各自选路。", "action": "签劳务或专业分包合同时，第一行落三件事：对方全称与统一社会信用代码、签约代表的授权文件、付款义务人（必须与签约方一致）。施工中留三类钱的痕迹：工资发放、材料设备转账、完税凭证。", "tags": {"identity": ["挂靠", "转包", "违法分包"], "target": ["分公司", "总公司", "签字个人"], "hinge": ["合同相对性", "劳动关系"], "newrule": "解释二第4条"}, "source_mix": "判决理由 3 条 + 编写人评析 1 条"}, {"no": "009", "vol": 1, "title": "以项目部名义借钱，缺了授权和印章就落回个人", "question": "同一张项目部借条，为什么有的判公司还、有的只判个人还？", "rule": "三条路逐条验：职务行为（是不是员工、是否在职权范围内）、表见代理（有无授权外观、相对人是否善意无过失）、追认（公司事后有无实际认可）。三条都不成立，借款责任落回签字个人。", "case_main": {"name": "河南省信阳安装总公司诉重庆工业设备安装集团有限公司、李春萌等民间借贷纠纷案", "court": "新疆生产建设兵团第六师中级人民法院", "no": "（2016）兵06民初102号"}, "case_ref": "对照案（合同加盖项目部印章，结论倒转为公司担责）", "flip": "三处：印章与账户（只有个人签名、款项未走公司账户，是本案两层皆输的直接原因）；相对人的身份与注意义务（全民所有制企业大额借款，审查义务被抬高）；事后追认（付息、入账、还款计划签字、内部协议把融资列为项目部职责，任一项即可打开追认）。", "action": "施工企业：在内部承包或项目管理协议里列对外行为清单，对外借款、担保、出具欠条与确认书一律须公司书面授权；印章刻制、领用、收回建台账；项目资金走公司或分公司账户。供货方：签约前只看三样：公司公章或备案项目部章、付款义务人是谁、签字人有无授权。", "tags": {"identity": ["项目部", "内部承包"], "target": ["总公司", "签字个人"], "hinge": ["授权与印章", "资金流向"], "newrule": "未涉及"}, "source_mix": "判决理由 3 层 + 编写人评析 1 条"}, {"no": "010", "vol": 1, "title": "替挂靠人还了账，为什么告发包人告不赢", "question": "出借资质的企业替挂靠人赔了钱，这笔损失能向谁追？", "rule": "追偿对象只有一个：借名字的挂靠人。发包人不是这笔债的债务人，告开发商方向先错。被挂靠企业对发包人仍可以承包人身份提起合同之诉，主张工程款与优先受偿权；被堵死的只是「我替人赔了钱、所以你要赔我」这一种提法。", "case_main": {"name": "湖南黄花建设集团股份有限公司诉常宁市盛和房地产开发有限责任公司、李某乙等追偿权纠纷案", "court": "湖南省高级人民法院（二审）", "no": "（2020）湘民终57号；一审（2018）湘04民初55号"}, "case_ref": "同一组关系的另一半：被挂靠公司以承包人身份起诉发包人，合同之诉可以立案，输赢回到实体审理", "flip": "三处：替付的是什么债（若本就是发包人的直接债务，追偿对象换人）；主张立在哪份合同上（合同之诉可立，追偿之诉对发包人不成立）；追偿凭据（内部关系约定＋逐笔付款证据，缺一样卡在事实认定）。新规下内部借名协议无效，资质借用费不再受支持。", "action": "借用资质项目按「谁欠谁」分开记账；对外付款逐笔建档（收据、判决、执行文书、付款凭证一一对应，注明替谁还的哪一笔）；两条路线分开走：对发包人按施工合同主张工程款，对挂靠人另案追偿，不写在同一张诉状里。", "tags": {"identity": ["挂靠", "出借资质企业"], "target": ["发包人", "挂靠人"], "hinge": ["合同相对性", "资金流向"], "newrule": "未涉及"}, "source_mix": "判决理由 2 条 + 编写人评析 1 条"}, {"no": "011", "vol": 1, "title": "出了钱的合伙人，不算实际施工人", "question": "五个人都说是自己干的，谁的名字能填进「实际施工人」那一栏？", "rule": "实际施工人是一道逐条过的资格线，不是一顶随项目赏的帽子。只出钱不上场，算不上；按工计酬、按天拿劳务费的班组，算不上；协议上写了名字但从不调人派工的，也算不上。要同时具备三件事：投入资金、实际组织施工管理、以自己的名义对外签料认账并承担风险。", "case_main": {"name": "郭某等与中冶天工集团有限公司、罗某甲等建设工程分包合同案", "court": "湘西土家族苗族自治州中级人民法院（二审）", "no": "（2020）湘31民终1113号；一审（2019）湘3101民初1574号"}, "case_ref": "许树宝案（班组按计件、按天结算，被挡在实际施工人门外）；同一案卷一审依一纸内部承包协议认身份，二审回到行为认定", "flip": "三处：出资之外有没有上场（既出资又管现场、对外认账的，从出资人挪到经营者）；受雇还是承包（包工包料、一口价、自负盈亏的班组可能越线，名字不决定身份，钱怎么算才决定）；协议本身不是身份证明（只挂名、只收钱的，新规下既拿不到管理费也换不来主体资格）。", "action": "每个在建项目做一张身份与凭据对照表，把「谁在管现场」和「谁在出钱」分开登记：现场负责人、实际组织施工的人、出资人、班组长各是谁；协议署名的人有没有真的调人、派工、收方；班组结算方式是按天计件，还是包工包料自负盈亏。", "tags": {"identity": ["实际施工人", "合伙人"], "target": ["总包", "前手"], "hinge": ["出资与经营"], "newrule": "未涉及"}, "source_mix": "判决理由 3 条 + 编写人评析 2 条"}, {"no": "012", "vol": 1, "title": "欠钱的公司破产，他绕开它去告业主", "question": "前手被受理破产之后，还能不能绕开它直接起诉发包人？", "rule": "不能。转包人对前手只有合同债权，前手一旦被裁定受理破产，这笔工程款就进入集体清偿的盘子，只能申报债权。唯一的例外是挂靠且发包人订立合同时明知或应当知道：此时施工合同直接落在借用资质人与发包人之间，他从一开始就是合同当事人，不受前手破产影响。", "case_main": {"name": "王某某、孙某1等诉滨海县人民政府招待所建设工程施工合同纠纷案", "court": "盐城市中级人民法院（二审）", "no": "（2021）苏09民终3681号民事裁定；一审（2020）苏0923民初4500号"}, "case_ref": "翔龙公司管理人诉常某请求撤销个别清偿行为纠纷案（（2019）鄂01民终13332号）：管理人请求撤销六个月内个别清偿，被驳回", "flip": "三处：身份是挂靠还是转包（挂靠＋发包人明知，合同直接约束发包人；转包则只能申报债权）；要的是工资还是工程款（农民工工资不受破产拖累，人工费以外的利息、违约金、损失走普通债权）；钱什么时候到手（受理后无效，受理前六个月内可能被撤销，诉讼、仲裁、执行形成的清偿除外）。", "action": "给每份在施合同排一次前手风险清单：相对方的涉诉、被执行、破产受理情况；受理裁定下来之前固定结算与签证资料；看到受理裁定立刻在申报期限内向管理人申报债权，不要把希望压在起诉业主上。", "tags": {"identity": ["转包", "挂靠", "实际施工人"], "target": ["发包人", "前手"], "hinge": ["破产受理"], "newrule": "解释二第6条"}, "source_mix": "判决理由 3 条 + 编写人评析 1 条"}, {"no": "013", "vol": 1, "title": "分包欠的工资，总包得先垫上", "question": "工程款被拖欠，为什么有的队伍能直接找总包要，有的不能？", "rule": "工资与工程款是两扇门。走工资这扇门不看合同相对性，只问两件事：是不是为用人单位提供劳动的农村居民，要的是不是提供劳动后的报酬。总包责任分三档：违法分包的直接清偿后追偿；合法分包且已尽用工监督、代发工资义务的，只在欠付工程款范围内担责；无违法分包也无怠于履职的，不担责。", "case_main": {"name": "陈某甲诉株洲伟业建筑专业技术有限公司湘西分公司、湖南省第四工程有限公司第三分公司建设工程施工合同案", "court": "湘西土家族苗族自治州中级人民法院（二审）", "no": "（2020）湘31民终1250号；一审（2020）湘3101民初665号"}, "case_ref": "对照案例（五名主张人卡在身份与实名登记这一层）", "flip": "三处：名目（写成材料款、租金、垫资款，条例接不上，只能回到合同相对性）；身份（算不算农村居民、有没有实名登记和用工记录）；总包自己的位置（有无过错，决定先垫还是只在欠付范围内担责）。最硬的一条：工资与材料款混在同一张结算单、同一项诉请里，通道就关。", "action": "工资与工程款分两本账：进场实名登记、考勤与工作量本人签字、工资支付表双方各留一份；欠条与结算单写准名目，工资、材料款、租金、垫资款分开列；起诉时工资单独列为一项请求，与银行流水、转账记录、工资表互相印证。", "tags": {"identity": ["实际施工人", "分包人"], "target": ["总包", "发包人"], "hinge": ["工资名目"], "newrule": "解释二第8条"}, "source_mix": "判决理由 2 条 + 编写人评析 2 条（含对条例客观归责的批评）"}, {"no": "014", "vol": 1, "title": "发包人把钱直接付给干活的，这笔账算数吗", "question": "发包人绕开签约企业，直接把钱付给实际施工人，能不能算已付工程款？", "rule": "看三条线：合同有没有限定收款主体与付款方式；每一笔钱的指向是否清楚；这笔支付有没有超出合同射程。合同限定只能付给签约企业、直付又没有书面确认的，签约企业仍可再要一遍。", "case_main": {"name": "南京三辉机电有限公司与南京石羊建设有限公司、南京庆华建设有限公司、潘森建设工程施工合同纠纷案", "court": "江苏省高级人民法院（再审）", "no": "（2020）苏民再20号；二审（2018）苏01民终4000号；一审（2017）苏0115民初9751号"}, "case_ref": "天津恒润消防工程有限公司诉天津津欧包装制品有限公司案（（2021）津0116民初18178号）：发包人不得未经法定程序向实际施工人清偿", "flip": "四条：合同怎么写，决定直付的起点；付款指向清不清楚，决定多少能算（指向不明的按比例切）；有没有超出合同射程，决定责任的分水；走没走诉讼或法定程序（该诉未诉的私下付款不算清偿）。", "action": "合同里写清收款主体、账户、付款方式；允许直付的把范围、比例、条件写明；不按约定路径支付的，付款前取得签约企业书面确认，把确认函、往来函件、付款凭证放在一起；以借款、垫资名义预支的，凭证上写清用途与抵扣方式。", "tags": {"identity": ["挂靠", "实际施工人"], "target": ["发包人", "总公司"], "hinge": ["付款指向"], "newrule": "未涉及"}, "source_mix": "判决理由 3 条 + 编写人评析 1 条（省高院提审改判）"}, {"no": "015", "vol": 1, "title": "出借资质，不等于连带还债", "question": "出借资质是违法的，违法就要对下游欠款连带吗？", "rule": "不等于。现行法只有两处写到出借方责任：民诉法解释第五十四条管程序（可以列为共同诉讼人），建筑法第六十六条只管质量不合格造成的损失（连带赔偿）。对下游欠款，真正决定输赢的是：合同抬头与落款写谁、下家签约时知不知道挂靠、出借方有没有按约付清。", "case_main": {"name": "四川省泸县得胜建筑工程有限公司与栗海峰、徐峰元、刘启进、赵良、红河华风房地产开发有限公司建设工程施工合同纠纷案", "court": "红河哈尼族彝族自治州中级人民法院（二审）", "no": "（2021）云25民终1998号；一审（2020）云2503民初173号"}, "case_ref": "陈某某诉沈阳顺和建设工程有限公司案（（2022）吉75民终58号）：挂靠人以自己名义对外分包，实际施工人不能向被挂靠人主张", "flip": "三条线：签名（抬头、章、结算落款主体，决定出借方在不在付款线上）；知情（下家签约时知不知道对面是挂靠，靠进场介绍、付款账户、对账记录证明）；付款是否按约（按约付给挂靠人仍不能对抗善意不知情的下家；压着不给，下家可走代位权）。另：资质借用费本身已不受保护。", "action": "挂靠项目的分包、转包合同，抬头、落款、用章统一到出借方名下，不出现一份合同两个主体；项目部章、合同专用章建台账；收挂靠人的费用按真实服务写内容与对价，不再写「资质借用费」；付给挂靠人的每笔钱按内部约定走，保留凭证。", "tags": {"identity": ["挂靠", "出借资质企业"], "target": ["发包人", "挂靠人", "前手"], "hinge": ["签名与知情"], "newrule": "解释二第4条"}, "source_mix": "判决理由 2 条 + 编写人评析 2 条 + 新规衔接"}, {"no": "016", "vol": 1, "title": "来要工程款的，不是干活的那个人", "question": "没资质、没干活、跟发包人没合同的人，凭什么能替别人来要钱？", "rule": "代位权。四个要件缺一不可：自己对债务人的债权合法、到期、金额确定；债务人对次债务人的债权已到期；债务人怠于行使（硬标准：不履行自己的到期债务，又不以诉讼或仲裁向相对人主张）；被代位的不是专属债务人自身的权利。相对人对债务人的抗辩，可以向债权人主张。", "case_main": {"name": "刘某甲诉富锦市福祥年村儿文化旅游发展有限公司债权人代位权案", "court": "黑龙江省高级人民法院（二审）", "no": "（2020）黑民终512号"}, "case_ref": "众合公司诉石油公司债权人代位权案（（2022）黔03民终1964号）：一审驳回、二审改判支持代位", "flip": "四条线：自己的债（未确定或不存在，代位无落脚点）；对方的债（未到期，相对人有权拒绝）；怠于两个字（已起诉或已申请仲裁，路就断；相对人主张债务人并非怠于的，举证责任在相对人）；被代位的东西（专属权利不可代位，且原有抗辩不因换人而消失）。", "action": "把对下游的欠付与对上游的应收成对记在一张台账上，标清金额、到期时间、有没有在诉讼或仲裁中主张；收到下游催款函或判决时，顺手核自己在外还有没有到期应收；作为发包人被代位起诉，先核三样：上手债权是否经生效裁判确认并到期、上手对自己的债权是否到期、自己对手上有哪些抗辩。", "tags": {"identity": ["实际施工人", "分包人"], "target": ["次债务人", "发包人"], "hinge": ["债权到期与怠于行使"], "newrule": "解释二第7条"}, "source_mix": "判决理由 3 条 + 编写人评析 1 条 + 会议纪要口径"}, {"no": "017", "vol": 1, "title": "债权转得出去，向发包人要钱的路转不过去", "question": "买下一笔工程款债权，能不能连「向发包人要钱」的资格一起买走？", "rule": "转让的是一笔债，不是一个位子。受让人能走到哪一层，取决于这笔债原本长在哪一层合同上：原本长在发包人与承包人合同上的，受让人站到合同这一层，可以直接找发包人；只是分包人对上手债权的，只能停在那一个上手身上，不能顺着往上穿透。", "case_main": {"name": "刘斌诉滁州市东方建筑安装工程有限公司、滁州市东方建筑安装工程有限公司全椒分公司等建设工程施工合同纠纷案", "court": "滁州市中级人民法院（二审）", "no": "（2017）皖11民终2700号；一审（2017）皖1124民初1072号"}, "case_ref": "成都新宏建筑工程有限公司诉成都市古奇鞋业有限公司案（（2020）川0107民初12971号）：受让人向发包人主张获支持", "flip": "四条线：自己的债（有效、到期、金额确定，无书面确认就要拿证据撑数额）；通知（未通知不对债务人生效，快递、短信、原债权人到庭认可三重动作叠加才稳）；债所处的那一层（判断方法：这笔债在原债权人手里能不能直接找发包人，他不能，你也不能）；专属性（实际施工人对发包人的请求权被归入专属性一侧，优先受偿权不随协议自动转移）。", "action": "受让或转让前画一行链条：发包人、承包人、分包人、干活的人各一格，标清被转让债权在哪一格、债务人是谁、合同付款条件是什么；核三样材料（权属与数额的书面确认、是否到期、通知送达凭证）；协议里写明受让人能否直接向发包人主张，约定不成，就别把发包人那一层的钱算进收购价。", "tags": {"identity": ["受让人", "分包人"], "target": ["发包人", "前手"], "hinge": ["通知送达"], "newrule": "解释二第7条"}, "source_mix": "判决理由 2 条 + 编写人评析 2 条"}, {"no": "018", "vol": 1, "title": "分公司不是法人，凭什么能自己去要工程款", "question": "起诉状原告一栏，写分公司还是必须写总公司？", "rule": "分公司不是法人，但落在民诉法解释第五十二条「其他组织」的筐里，依法设立并领取营业执照就可以当原告、当被告。它不能做的只有一件事：和所属法人或同属一个法人的兄弟分公司打官司，那属于公司内部治理，法院不受理。责任先以分公司管理的财产承担，不足部分由法人补上。", "case_main": {"name": "通化市二建实业有限公司梅河口市分公司诉吉林益丰宝生物质新材料有限公司建设工程施工合同纠纷案", "court": "吉林省柳河县人民法院", "no": "（2021）吉0524民初601号"}, "case_ref": "北京市通州区建筑集团公司第十二工程处诉第十一工程处案（（2013）通民初字第6972号，兄弟分公司之间的纠纷被裁定驳回起诉）", "flip": "四条线：对手是谁（外部平等关系才可以；对所属法人或兄弟分公司不行）；能当原告不等于钱落分公司（债权最终归法人）；主体资格与合同效力是两件事（合同无效，分公司仍可能是适格原告）；没有营业执照的项目部、工程处进不了这个筐。", "action": "以分公司名义起诉前备齐三样：营业执照复印件、总公司对本次诉讼的授权或确认文件（负责人离任、印章收缴时尤其要有）、合同与结算文件上的分公司签章页。对手是外部主体的，考虑把总公司列为共同原告或备位被告，执行时能动的财产不止分公司那一笔。", "tags": {"identity": ["分公司"], "target": ["发包人", "总公司"], "hinge": ["登记与对等"], "newrule": "未涉及"}, "source_mix": "判决理由 2 条 + 编写人评析 1 条 + 反例 1 件"}, {"no": "019", "vol": 1, "title": "资质借给别人用，干活的就不是你", "question": "合同是你签的、章是你盖的、钱打到你账上，法院为什么认定干活的是别人？", "rule": "实际施工人的认定不按合同封面来。合同、中标通知书、发票、流水都只是线索，法院看的是另一组事实：人是谁招的、工资谁发、材料谁买、钱进谁的账、项目部听谁指挥。这组事实指向别人，合同上那个名字就只剩一个壳；壳里可能还留下一笔性质完全不同的往来款。", "case_main": {"name": "巴东县兴东建设总公司诉恩施上盈投资有限公司民间借贷纠纷案", "court": "恩施土家族苗族自治州中级人民法院（二审）", "no": "（2019）鄂28民终193号；一审（2018）鄂2801民初4629号"}, "case_ref": "（2021）新0121民初454号／（2021）新01民终4158号／（2022）新民申82号（同一争点的对照处理）", "flip": "四条线：发包人订约时知不知道借用资质（知情则可直接主张，解释二第四条）；质量合格才有折价补偿（合同无效不等于白干，验收合格是分水岭）；钱的性质靠凭证固定（有借据、承诺书、写明本息用途的，才容易被单独认定为借贷）；抵账要靠得住的证据（单方编制的账本、出具方否认的审计报告没有用）。", "action": "资质出借期间替对方垫付的每一笔钱，付款当天做出三样凭证：借款申请（用途、金额、归还时间、还款来源）、收款确认（钱的实际去向）、还款计划（利息与违约后果），一周内补齐交同一名财务归档；工程款流水与借贷往来分设两本账；造价、审计文件由双方共同委托、共同确认。", "tags": {"identity": ["出借资质企业", "挂靠人"], "target": ["挂靠人", "发包人"], "hinge": ["质量合格", "资金流向"], "newrule": "解释二第3条"}, "source_mix": "判决理由 3 条 + 编写人评析 2 条"}, {"no": "020", "vol": 1, "title": "两个干活的各拿一份判决，钱只有一笔", "question": "同一笔欠款，几个实际施工人各拿一份判决，加起来超过了发包人欠的数，怎么办？", "rule": "每个实际施工人都可以在发包人欠付承包人的范围内主张，但几份判决加起来不能超过那一笔欠付。前提是欠付数额查清；主张必须限定在欠付范围内；分包合同、突破合同相对性、代位权三条救济路径不能在同一案件里混用。", "case_main": {"name": "翁某某诉福建某公路公司、厦门某建设公司平潭分公司等建设工程施工合同纠纷案", "court": "福州市中级人民法院（二审）", "no": "（2022）闽01民终1909号；一审（2021）闽0128民初64号"}, "case_ref": "桂林德天案（（2021）桂03民终311号，欠付数额未查清，请求被认定为空判）", "flip": "四条线：欠付数额有没有查清（查不清，请求再对也可能是空判）；救济模式有没有混用（三条路不能一起走，法院会要求明确向谁主张）；是不是同一个人反复主张同一笔钱（看前后两案当事人、标的、请求是否实质相同）；时间点在 2026 年 6 月 30 日前后（新案直诉通道已改道，老案按旧规）。", "action": "主张在欠付范围内担责的一方，先把「发包人还欠承包人多少」做成一份证据：结算确认单、付款流水、保留款条款；起诉时明确只选一条救济路径，不把业主、总包、分包、实际控制人一并列成共同被告碰运气；同一项目已有生效判决的，先查是否同一笔款项。", "tags": {"identity": ["实际施工人", "分包人"], "target": ["发包人", "前手"], "hinge": ["欠付数额查清"], "newrule": "解释二第6条"}, "source_mix": "判决理由 3 条 + 编写人评析 2 条"}];
const on = {};
const list = document.getElementById('list');
const q = document.getElementById('q');
const cnt = document.getElementById('count');
function tagsOf(c){return [...c.tags.identity, ...c.tags.target, ...c.tags.hinge, c.tags.newrule];}
function render(){
  const kw = q.value.trim().toLowerCase();
  const active = Object.entries(on).filter(([,v])=>v.size).map(([k,v])=>[k,[...v]]);
  const rows = DATA.filter(c=>{
    if(active.length){
      for(const [k,vals] of active){
        const own = k==='hinge'? c.tags.hinge : (k==='newrule'? [c.tags.newrule] : c.tags[k]);
        if(!vals.some(v=>own.includes(v))) return false;
      }
    }
    if(!kw) return true;
    const hay = [c.no,c.title,c.question,c.rule,c.flip,c.action,c.case_main.name,c.case_main.court,c.case_main.no,c.case_ref,...tagsOf(c)].join(' ').toLowerCase();
    return hay.includes(kw);
  });
  cnt.textContent = `显示 ${rows.length} / ${DATA.length} 张`;
  if(!rows.length){list.innerHTML='<div class="empty">没有匹配的卡片。换个关键词，或清掉筛选。</div>';return;}
  list.innerHTML = rows.map(c=>`
    <article class="card">
      <div class="chead"><span class="no">${c.no}</span><h2>${c.title}</h2></div>
      <div class="q">${c.question}</div>
      <div class="row"><div class="k">规则</div><div class="v">${c.rule}</div></div>
      <div class="row"><div class="k">判例</div><div class="v cite">${c.case_main.name}<br>${c.case_main.court} · ${c.case_main.no}</div></div>
      <div class="row"><div class="k">反向</div><div class="v cite">${c.case_ref}</div></div>
      <details><summary>翻转条件</summary><div class="v">${c.flip}</div></details>
      <details><summary>可以立即去做的事</summary><div class="v">${c.action}</div></details>
      <div class="tags">
        ${c.tags.identity.map(t=>`<span class="t">${t}</span>`).join('')}
        ${c.tags.target.map(t=>`<span class="t">告：${t}</span>`).join('')}
        <span class="t">胜负手：${c.tags.hinge.join(' · ')}</span>
        <span class="t new">${c.tags.newrule}</span>
      </div>
      <div class="src">${c.source_mix}</div>
    </article>`).join('');
}
document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{
  const k=b.dataset.key,v=b.dataset.val;
  on[k]=on[k]||new Set();
  if(on[k].has(v)){on[k].delete(v);b.classList.remove('on');}else{on[k].add(v);b.classList.add('on');}
  render();
}));
q.addEventListener('input',render);
addEventListener('scroll',()=>document.getElementById('sb').classList.toggle('stuck',scrollY>40));
if(matchMedia('(max-width:640px)').matches) document.getElementById('fb').open=false;
render();
</script></body></html>
